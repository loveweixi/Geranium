name: Build Geranium LocSim

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-tipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned TrollStore package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install ldid
        run: brew install ldid

      - name: Build Geranium.tipa
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Verify package
        run: |
          test -s build/Geranium.tipa
          unzip -t build/Geranium.tipa
          shasum -a 256 build/Geranium.tipa | tee build/Geranium.tipa.sha256

      - name: Upload TrollStore package
        uses: actions/upload-artifact@v7
        with:
          name: Geranium-LocSim-tipa
          path: |
            build/Geranium.tipa
            build/Geranium.tipa.sha256
          if-no-files-found: error
          retention-days: 30
